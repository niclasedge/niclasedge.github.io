    <text x="115" y="225" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#a0a2aa">TickTick</text>
  </g>

  <path d="M395 275H475" stroke="#45c4b8" stroke-width="4" marker-end="url(#arr)"/>

