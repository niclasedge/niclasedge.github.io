    <g transform="translate(474 204)">
      <rect width="96" height="36" rx="8" fill="#2a2b30"/><text x="48" y="24" text-anchor="middle" fill="#ececee">Elastic</text>
      <rect x="104" width="86" height="36" rx="8" fill="#2a2b30"/><text x="147" y="24" text-anchor="middle" fill="#ff7b72">Alarme</text>
      <rect y="46" width="96" height="36" rx="8" fill="#2a2b30"/><text x="48" y="70" text-anchor="middle" fill="#ececee">CoreDNS</text>
