<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2b30" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#1e1f22"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#e0b07a"/>
  <text x="60" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#a0a2aa">niclasedge.github.io · Infra</text>

  <!-- Tailnet -->
  <g stroke="#e0b07a" stroke-width="3">
    <path d="M230 310V370M590 310V354M950 310V370"/>
    <path d="M230 370H950" stroke-dasharray="10 8"/>
  </g>
  <rect x="520" y="354" width="140" height="32" rx="16" fill="#1e1f22" stroke="#e0b07a" stroke-width="2"/>
  <text x="590" y="376" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#e0b07a">Tailscale</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
