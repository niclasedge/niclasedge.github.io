      <text x="24" y="78" font-size="18" fill="#a0a2aa">Web</text>
    </g>
  </g>

  <!-- Chips -->
  <g font-family="Menlo, monospace" font-size="17">
    <g transform="translate(114 204)">
      <rect width="66" height="36" rx="8" fill="#2a2b30"/><text x="33" y="24" text-anchor="middle" fill="#ececee">just</text>
      <rect x="74" width="96" height="36" rx="8" fill="#2a2b30"/><text x="122" y="24" text-anchor="middle" fill="#ececee">Ansible</text>
      <rect y="46" width="126" height="36" rx="8" fill="#2a2b30"/><text x="63" y="70" text-anchor="middle" fill="#b79cff">SOPS+age</text>
