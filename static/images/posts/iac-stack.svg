  <text x="60" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#ececee">IaC-Stack: Homelab als Code</text>
  <text x="60" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#e0b07a">Ansible, Semaphore, Elastic und SOPS – wer was macht</text>
