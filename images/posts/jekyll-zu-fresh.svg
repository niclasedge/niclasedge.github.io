<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2b30" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#62a5ff"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#1e1f22"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#62a5ff"/>
  <text x="60" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#a0a2aa">niclasedge.github.io · Dev</text>

  <!-- Rubin (Jekyll) -->
  <g transform="translate(330 120)">
    <path d="M-80 40L-40 0H40L80 40L0 140Z" fill="#3a2427" stroke="#ff7b72" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-80 40H80M-40 0L-20 40L0 140L20 40L40 0M-20 40H20" fill="none" stroke="#ff7b72" stroke-width="2.5" opacity=".7"/>
    <text x="0" y="190" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#a0a2aa">Jekyll + Chirpy</text>
  </g>

  <path d="M470 190H700" stroke="#62a5ff" stroke-width="5" marker-end="url(#arr)"/>
  <text x="585" y="172" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#a0a2aa">2022 → 2026</text>

  <!-- Zitrone (Fresh) -->
  <g transform="translate(860 190)">
    <ellipse cx="0" cy="0" rx="92" ry="66" transform="rotate(-20)" fill="#3a3620" stroke="#f5c842" stroke-width="4"/>
    <path d="M-90 30q-14 8 -24 2M90 -30q14 -8 24 -2" fill="none" stroke="#f5c842" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 -60q20 -30 50 -28" fill="none" stroke="#52cc88" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="120" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ececee">Deno Fresh 2</text>
  </g>

  <!-- Export-Pipeline -->
  <g font-family="Menlo, monospace" font-size="20" fill="#ececee">
    <rect x="150" y="380" width="200" height="50" rx="10" fill="#26272b" stroke="#45464d" stroke-width="2"/>
    <text x="250" y="412" text-anchor="middle">vite build</text>
    <path d="M355 405H405" stroke="#62a5ff" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="410" y="380" width="200" height="50" rx="10" fill="#26272b" stroke="#62a5ff" stroke-width="2"/>
    <text x="510" y="412" text-anchor="middle">export.ts</text>
    <path d="M615 405H665" stroke="#62a5ff" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="670" y="380" width="160" height="50" rx="10" fill="#26272b" stroke="#45464d" stroke-width="2"/>
    <text x="750" y="412" text-anchor="middle">_site/</text>
    <path d="M835 405H885" stroke="#62a5ff" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="890" y="380" width="160" height="50" rx="10" fill="#26272b" stroke="#45464d" stroke-width="2"/>
    <text x="970" y="412" text-anchor="middle">gh-pages</text>
  </g>

  <text x="60" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#ececee">Von Jekyll zu Fresh 2</text>
  <text x="60" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#62a5ff">Statisch exportiert für GitHub Pages – keine alte URL verloren</text>
</svg>
